<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />

    <!-- ============================================================
    منع الوصول من البداية - التحقق من تسجيل الدخول
    ============================================================ -->
    <script>
        (function checkAuth() {
            var user = JSON.parse(localStorage.getItem('user') || '{}');
            if (!user || !user.email) {
                window.location.replace('login.html');
                return;
            }
            window.currentUser = user;
        })();
    </script>

    <title>سجل الحجوزات - منتجع حياله</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <style>
        /* ============================================================
           ROOT VARIABLES
           ============================================================ */
        :root {
            --ink: #121821;
            --ink-soft: #2c3644;
            --ink-mute: #6d7883;
            --paper: #eef1ef;
            --surface: #ffffff;
            --surface-muted: #f4f6f5;
            --line: #dde3e0;
            --line-strong: #c7d0cc;
            --accent: #dd9f2e;
            --accent-ink: #7a5312;
            --accent-soft: #faead0;
            --teal: #1d7b6c;
            --teal-soft: #e2f2ee;
            --rust: #bf4f30;
            --rust-soft: #fbe8e1;
            --blue: #2f5b8a;
            --radius: 14px;
            --radius-sm: 9px;
            --shadow: 0 14px 34px -16px rgba(18,24,33,0.28);
            --shadow-sm: 0 3px 10px -4px rgba(18,24,33,0.18);
            --font-display: 'Cairo', 'Segoe UI', Tahoma, Arial, sans-serif;
            --font-mono: 'JetBrains Mono', ui-monospace, monospace;
            --header-height: 60px;
            --stripe-height: 4px;
            --mobile-nav-height: 56px;
            --sidebar-w: 270px;

            /* ===== SCALE DOWN 10% ===== */
            --scale-factor: 0.9;
        }

        /* ============================================================
           GLOBAL RESET & SCALING
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            font-size: calc(16px * var(--scale-factor));
        }

        body {
            font-family: var(--font-display);
            background: var(--paper);
            color: var(--ink);
            direction: rtl;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            font-size: calc(1rem * var(--scale-factor));
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* ============================================================
           SCROLLBAR STYLING
           ============================================================ */
        ::-webkit-scrollbar {
            width: calc(5px * var(--scale-factor));
            height: calc(5px * var(--scale-factor));
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--line-strong);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--ink-mute);
        }

        /* ============================================================
           SWATCH STRIPE
           ============================================================ */
        .swatch-stripe {
            height: calc(var(--stripe-height) * var(--scale-factor));
            flex-shrink: 0;
            display: flex;
            border-radius: calc(4px * var(--scale-factor)) calc(4px * var(--scale-factor)) 0 0;
            overflow: hidden;
        }
        .swatch-stripe span {
            flex: 1;
        }
        .swatch-stripe span:nth-child(1) {
            background: var(--accent);
        }
        .swatch-stripe span:nth-child(2) {
            background: var(--teal);
        }
        .swatch-stripe span:nth-child(3) {
            background: var(--rust);
        }
        .swatch-stripe span:nth-child(4) {
            background: var(--blue);
        }

        /* ============================================================
           HEADER - تصميم محسّن
           ============================================================ */
        header {
            position: sticky;
            top: 0;
            z-index: 1000;
            padding: 0 calc(20px * var(--scale-factor));
            background: rgba(255, 255, 255, 0.97);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--line);
            height: calc(var(--header-height) * var(--scale-factor));
            display: flex;
            align-items: center;
            flex-shrink: 0;
        }
        header .header-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: calc(11px * var(--scale-factor));
            flex-shrink: 0;
        }
        .logo-mark {
            width: calc(36px * var(--scale-factor));
            height: calc(36px * var(--scale-factor));
            border-radius: calc(10px * var(--scale-factor));
            background: var(--ink);
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: calc(3px * var(--scale-factor));
            padding: calc(6px * var(--scale-factor));
            flex-shrink: 0;
        }
        .logo-mark span {
            border-radius: calc(2px * var(--scale-factor));
        }
        .logo-mark span:nth-child(1) {
            background: var(--accent);
        }
        .logo-mark span:nth-child(2) {
            background: var(--teal);
        }
        .logo-mark span:nth-child(3) {
            background: var(--rust);
        }
        .logo-mark span:nth-child(4) {
            background: var(--blue);
        }
        .logo-text h1 {
            font-size: calc(0.95rem * var(--scale-factor));
            font-weight: 800;
            color: var(--ink);
            line-height: 1.25;
            letter-spacing: -0.2px;
        }
        .logo-text span {
            font-size: calc(0.62rem * var(--scale-factor));
            color: var(--ink-mute);
            display: block;
            font-weight: 600;
        }

        /* ===== القائمة العلوية - تصميم محسّن ===== */
        nav {
            display: flex;
            align-items: center;
            gap: calc(2px * var(--scale-factor));
            flex-wrap: wrap;
            background: var(--surface);
            padding: calc(3px * var(--scale-factor));
            border-radius: calc(50px * var(--scale-factor));
            border: 1px solid var(--line);
            box-shadow: 0 1px 4px rgba(0,0,0,0.02);
        }
        nav a {
            color: var(--ink-mute);
            font-weight: 700;
            font-size: calc(0.65rem * var(--scale-factor));
            transition: 0.25s ease;
            position: relative;
            padding: calc(6px * var(--scale-factor)) calc(14px * var(--scale-factor));
            border-radius: calc(50px * var(--scale-factor));
            white-space: nowrap;
            letter-spacing: 0.2px;
            display: flex;
            align-items: center;
            gap: calc(4px * var(--scale-factor));
        }
        nav a::after {
            content: '';
            position: absolute;
            bottom: calc(3px * var(--scale-factor));
            right: 50%;
            width: 0;
            height: calc(2px * var(--scale-factor));
            background: var(--accent);
            transition: 0.3s ease;
            border-radius: 10px;
            transform: translateX(50%);
        }
        nav a:hover {
            color: var(--ink);
            background: var(--surface-muted);
        }
        nav a:hover::after {
            width: 40%;
        }
        nav a.active {
            color: var(--ink);
            background: var(--accent-soft);
            font-weight: 800;
        }
        nav a.active::after {
            width: 40%;
            background: var(--accent);
        }

        nav a .nav-icon {
            font-size: calc(0.7rem * var(--scale-factor));
            opacity: 0.7;
        }
        nav a.active .nav-icon {
            opacity: 1;
            color: var(--accent-ink);
        }
        nav a:hover .nav-icon {
            opacity: 1;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: calc(6px * var(--scale-factor));
            flex-shrink: 0;
        }
        .header-actions button {
            width: calc(32px * var(--scale-factor));
            height: calc(32px * var(--scale-factor));
            border-radius: calc(8px * var(--scale-factor));
            border: 1px solid var(--line);
            background: var(--surface);
            color: var(--ink-mute);
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: calc(0.8rem * var(--scale-factor));
        }
        .header-actions button:hover {
            background: var(--ink);
            border-color: var(--ink);
            color: #fff;
        }
        .hamburger {
            display: none;
            font-size: calc(1.05rem * var(--scale-factor));
            color: var(--ink);
            cursor: pointer;
            padding: calc(6px * var(--scale-factor)) calc(10px * var(--scale-factor));
            border-radius: calc(8px * var(--scale-factor));
            border: 1px solid var(--line);
            background: var(--surface);
        }

        /* ============================================================
           SIDEBAR — مغلقة افتراضياً على الموبايل، تظهر على سطح المكتب
           ============================================================ */
        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(18, 24, 33, 0.35);
            z-index: 999;
            backdrop-filter: blur(3px);
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }
        .sidebar-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .sidebar {
            position: fixed;
            top: 0;
            right: 0;
            width: calc(var(--sidebar-w) * 1px);
            height: 100vh;
            background: #ffffff;
            border-left: 1px solid var(--line);
            z-index: 1000;
            padding: calc(60px * var(--scale-factor)) calc(18px * var(--scale-factor)) calc(30px * var(--scale-factor));
            transition: right 0.35s ease;
            overflow-y: auto;
            box-shadow: var(--shadow);
        }

        @media (max-width: 768px) {
            .sidebar {
                right: calc(-1 * var(--sidebar-w));
            }
            .sidebar.open {
                right: 0;
            }
            .sidebar-overlay {
                display: block;
            }
        }

        .sidebar .close-btn {
            position: absolute;
            top: calc(12px * var(--scale-factor));
            left: calc(12px * var(--scale-factor));
            font-size: calc(1.2rem * var(--scale-factor));
            color: var(--ink-mute);
            cursor: pointer;
            padding: calc(4px * var(--scale-factor)) calc(8px * var(--scale-factor));
            border-radius: calc(8px * var(--scale-factor));
            border: 1px solid var(--line);
        }
        .sidebar .close-btn:hover {
            background: var(--accent-soft);
            color: var(--accent-ink);
        }
        .sidebar .menu-items a {
            display: flex;
            align-items: center;
            gap: calc(10px * var(--scale-factor));
            padding: calc(9px * var(--scale-factor)) calc(12px * var(--scale-factor));
            border-radius: calc(8px * var(--scale-factor));
            color: var(--ink-soft);
            font-weight: 700;
            font-size: calc(0.85rem * var(--scale-factor));
            transition: 0.2s;
        }
        .sidebar .menu-items a i {
            width: calc(18px * var(--scale-factor));
            color: var(--ink-mute);
        }
        .sidebar .menu-items a:hover {
            background: var(--surface-muted);
        }
        .sidebar .menu-items a.active {
            background: var(--accent-soft);
            color: var(--accent-ink);
        }
        .sidebar .menu-items a.active i {
            color: var(--accent-ink);
        }

        /* ============================================================
           MOBILE NAV BOTTOM
           ============================================================ */
        .mobile-nav-bottom {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 998;
            background: #ffffff;
            border-top: 1px solid var(--line);
            padding: calc(4px * var(--scale-factor)) 0 calc(4px * var(--scale-factor) + env(safe-area-inset-bottom));
            height: calc(var(--mobile-nav-height) * var(--scale-factor));
            box-shadow: 0 calc(-4px * var(--scale-factor)) calc(20px * var(--scale-factor)) rgba(0,0,0,0.04);
        }
        .mobile-nav-bottom ul {
            display: flex;
            justify-content: space-around;
            list-style: none;
            height: 100%;
            align-items: center;
            margin: 0;
            padding: 0;
        }
        .mobile-nav-bottom ul li {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: calc(1px * var(--scale-factor));
            font-size: calc(0.4rem * var(--scale-factor));
            color: var(--ink-mute);
            transition: 0.2s;
            padding: calc(2px * var(--scale-factor)) calc(8px * var(--scale-factor));
            border-radius: calc(6px * var(--scale-factor));
            cursor: pointer;
            flex: 1;
        }
        .mobile-nav-bottom ul li i {
            font-size: calc(0.85rem * var(--scale-factor));
        }
        .mobile-nav-bottom ul li:hover,
        .mobile-nav-bottom ul li.active {
            color: var(--accent-ink);
        }
        .mobile-nav-bottom ul li a {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: calc(1px * var(--scale-factor));
            color: inherit;
            text-decoration: none;
            width: 100%;
        }

        /* ============================================================
           MAIN CONTENT - تنسيق صفحة الحجوزات
           ============================================================ */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding: calc(14px * var(--scale-factor)) calc(18px * var(--scale-factor)) calc(16px * var(--scale-factor)) calc(18px * var(--scale-factor));
        }

        .page-wrapper {
            flex: 1;
            overflow-y: auto;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        /* ============================================================
           HEADER SECTION
           ============================================================ */
        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 0 20px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .page-header h1 {
            font-size: calc(1.3rem * var(--scale-factor));
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .page-header h1 i {
            color: var(--accent);
        }

        .page-header .actions {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        /* ============================================================
           BUTTONS
           ============================================================ */
        .btn {
            padding: calc(8px * var(--scale-factor)) calc(18px * var(--scale-factor));
            border: none;
            border-radius: calc(10px * var(--scale-factor));
            font-family: var(--font-display);
            font-weight: 700;
            font-size: calc(0.8rem * var(--scale-factor));
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--ink);
            color: #ffffff;
        }
        .btn-primary:hover {
            background: var(--ink-soft);
            transform: translateY(calc(-2px * var(--scale-factor)));
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
        }

        .btn-success {
            background: var(--teal);
            color: #ffffff;
        }
        .btn-success:hover {
            background: #156b5d;
            transform: translateY(calc(-2px * var(--scale-factor)));
        }

        .btn-warning {
            background: var(--accent);
            color: var(--accent-ink);
        }
        .btn-warning:hover {
            background: var(--accent-ink);
            color: #fff;
            transform: translateY(calc(-2px * var(--scale-factor)));
        }

        .btn-danger {
            background: var(--rust);
            color: #ffffff;
        }
        .btn-danger:hover {
            background: #a63a31;
            transform: translateY(calc(-2px * var(--scale-factor)));
        }

        .btn-outline {
            background: transparent;
            border: 1.5px solid var(--line);
            color: var(--ink-soft);
        }
        .btn-outline:hover {
            background: var(--surface-muted);
            border-color: var(--line-strong);
        }

        .btn-sm {
            padding: calc(4px * var(--scale-factor)) calc(10px * var(--scale-factor));
            font-size: calc(0.65rem * var(--scale-factor));
            border-radius: calc(8px * var(--scale-factor));
        }

        /* ============================================================
           CARD
           ============================================================ */
        .card {
            background: var(--surface);
            border-radius: calc(16px * var(--scale-factor));
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--line);
            overflow: hidden;
        }

        .card-header {
            padding: calc(16px * var(--scale-factor)) calc(20px * var(--scale-factor));
            border-bottom: 1px solid var(--line);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }

        .card-header h2 {
            font-size: calc(0.9rem * var(--scale-factor));
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-header .badge {
            background: var(--surface-muted);
            padding: calc(2px * var(--scale-factor)) calc(12px * var(--scale-factor));
            border-radius: 50px;
            font-size: calc(0.65rem * var(--scale-factor));
            font-weight: 700;
            color: var(--ink-mute);
        }

        .card-body {
            padding: calc(18px * var(--scale-factor)) calc(20px * var(--scale-factor));
            overflow-x: auto;
        }

        /* ============================================================
           TABLE
           ============================================================ */
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: calc(0.8rem * var(--scale-factor));
            min-width: 1100px;
        }

        table thead th {
            background: var(--surface-muted);
            padding: calc(10px * var(--scale-factor)) calc(12px * var(--scale-factor));
            text-align: center;
            font-weight: 700;
            font-size: calc(0.65rem * var(--scale-factor));
            color: var(--ink-mute);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 2px solid var(--line);
            white-space: nowrap;
        }

        table tbody td {
            padding: calc(10px * var(--scale-factor)) calc(12px * var(--scale-factor));
            text-align: center;
            border-bottom: 1px solid var(--line);
            color: var(--ink-soft);
            font-size: calc(0.78rem * var(--scale-factor));
            white-space: nowrap;
        }

        table tbody tr:hover {
            background: var(--surface-muted);
        }

        table tbody tr:last-child td {
            border-bottom: none;
        }

        table tbody tr.is-future td:first-child,
        table tbody tr.is-future td:nth-child(3) {
            color: var(--blue);
            font-weight: 700;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 12px;
            border-radius: 50px;
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 0.2px;
        }
        .badge-paid {
            background: var(--teal-soft);
            color: var(--teal);
        }
        .badge-balance {
            background: var(--rust-soft);
            color: var(--rust);
        }
        .badge-type {
            background: var(--surface-muted);
            color: var(--ink-mute);
        }
        .badge-future {
            background: var(--accent-soft);
            color: var(--accent-ink);
        }

        .actions-cell {
            display: flex;
            gap: 6px;
            justify-content: center;
            flex-wrap: wrap;
        }

        /* ============================================================
           TOAST
           ============================================================ */
        .toast-container {
            position: fixed;
            top: calc(80px * var(--scale-factor));
            right: calc(20px * var(--scale-factor));
            z-index: 99999;
            max-width: calc(380px * var(--scale-factor));
            width: 90%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            gap: calc(8px * var(--scale-factor));
        }

        .toast {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: calc(12px * var(--scale-factor));
            padding: calc(12px * var(--scale-factor)) calc(16px * var(--scale-factor));
            display: flex;
            align-items: center;
            gap: calc(10px * var(--scale-factor));
            transform: translateX(calc(20px * var(--scale-factor)));
            transition: all 0.4s ease;
            opacity: 0;
            pointer-events: auto;
            box-shadow: var(--shadow);
            border-right: calc(4px * var(--scale-factor)) solid var(--ink);
        }

        .toast.show {
            transform: translateX(0);
            opacity: 1;
        }

        .toast .toast-icon {
            font-size: calc(1rem * var(--scale-factor));
            width: calc(30px * var(--scale-factor));
            height: calc(30px * var(--scale-factor));
            min-width: calc(30px * var(--scale-factor));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .toast .toast-icon.success {
            color: var(--teal);
            background: var(--teal-soft);
        }
        .toast .toast-icon.error {
            color: var(--rust);
            background: var(--rust-soft);
        }
        .toast .toast-icon.warning {
            color: var(--accent-ink);
            background: var(--accent-soft);
        }

        .toast .toast-title {
            font-size: calc(0.82rem * var(--scale-factor));
            font-weight: 800;
            color: var(--ink);
        }
        .toast .toast-message {
            font-size: calc(0.72rem * var(--scale-factor));
            color: var(--ink-mute);
            margin-top: calc(1px * var(--scale-factor));
        }

        .toast .toast-close {
            background: none;
            border: none;
            color: var(--ink-mute);
            cursor: pointer;
            font-size: calc(0.85rem * var(--scale-factor));
            padding: calc(4px * var(--scale-factor));
            margin-right: auto;
        }

        /* ============================================================
           EMPTY STATE
           ============================================================ */
        .empty-state {
            text-align: center;
            padding: calc(50px * var(--scale-factor)) calc(20px * var(--scale-factor));
            color: var(--ink-mute);
        }

        .empty-state i {
            font-size: calc(3rem * var(--scale-factor));
            opacity: 0.3;
            margin-bottom: 16px;
            display: block;
        }

        .empty-state p {
            font-size: calc(0.85rem * var(--scale-factor));
            color: var(--ink-soft);
        }

        .empty-state span {
            font-size: calc(0.7rem * var(--scale-factor));
            color: var(--ink-mute);
        }

        .spinner {
            display: inline-block;
            width: calc(30px * var(--scale-factor));
            height: calc(30px * var(--scale-factor));
            border: 3px solid var(--line);
            border-top: 3px solid var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 768px) {
            :root {
                --scale-factor: 1;
            }

            .sidebar {
                right: calc(-1 * var(--sidebar-w));
            }
            .sidebar.open {
                right: 0;
            }
            .sidebar-overlay {
                display: block;
            }

            .main-content {
                padding: 12px;
                padding-bottom: calc(80px + env(safe-area-inset-bottom));
            }

            .page-header {
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
            }

            .page-header .actions {
                justify-content: stretch;
            }

            .page-header .actions .btn {
                flex: 1;
                justify-content: center;
            }

            .card-body {
                padding: 12px 14px;
            }

            table {
                font-size: 0.7rem;
                min-width: 700px;
            }

            table thead th,
            table tbody td {
                padding: 6px 8px;
            }

            .actions-cell {
                flex-direction: column;
                gap: 4px;
            }

            .actions-cell .btn {
                width: 100%;
                justify-content: center;
            }

            .mobile-nav-bottom {
                display: flex !important;
            }
            .hamburger {
                display: flex !important;
            }
            nav {
                display: none !important;
            }
        }

        @media (max-width: 480px) {
            .page-header h1 {
                font-size: 1.1rem;
            }

            .card-header {
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
            }

            table {
                font-size: 0.6rem;
                min-width: 500px;
            }

            table thead th:nth-child(3),
            table tbody td:nth-child(3) {
                display: none;
            }

            .header .breadcrumb {
                display: none;
            }
        }

        .fade-up {
            opacity: 0;
            transform: translateY(8px);
            animation: fadeUp .55s var(--ease) forwards;
        }
        @keyframes fadeUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ============================================================
           SCALE DOWN THE MAIN CONTENT TO 90%
           ========================================================== */
        .main-content {
            transform: scale(0.9);
            transform-origin: top center;
        }
    </style>
</head>
<body>

    <!-- ============================================================
    SIDEBAR OVERLAY
    ============================================================ -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- ============================================================
    SIDEBAR — مغلقة افتراضياً على الموبايل، تظهر على سطح المكتب
    ============================================================ -->
    <nav class="sidebar" id="sidebar">
        <div class="close-btn" id="closeSidebar"><i class="fas fa-times"></i></div>
        <div class="menu-items">
            <a href="index.html"><i class="fas fa-home"></i> الرئيسية</a>
            <a href="add-invoice.html"><i class="fas fa-file-invoice"></i> فاتورة جديدة</a>
            <a href="bookings.html" class="active"><i class="fas fa-list"></i> سجل الحجوزات</a>
            <a href="clients.html"><i class="fas fa-users"></i> العملاء</a>
            <a href="properties.html"><i class="fas fa-building"></i> العقارات</a>
            <a href="expenses.html"><i class="fas fa-money-bill-wave"></i> المصاريف</a>
            <a href="abuzeid.html"><i class="fas fa-hand-holding-heart"></i> عمولة أبو زيد</a>
            <a href="future.html"><i class="fas fa-calendar-check"></i> الحجوزات المستقبلية</a>
            <a href="users.html"><i class="fas fa-users-cog"></i> المستخدمين</a>
            <a href="#"><i class="fas fa-chart-pie"></i> التقارير</a>
        </div>
    </nav>

    <!-- ============================================================
    MAIN
    ========================================================== -->
    <div class="main" id="main">

        <!-- ===== HEADER ===== -->
        <header class="header">
            <div class="left">
                <button class="hamburger" id="hamburger" aria-label="فتح القائمة"><i class="fas fa-bars"></i></button>
                <div class="breadcrumb"><b>سجل الحجوزات</b> / قائمة الحجوزات</div>
            </div>
            <div class="search">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="ابحث عن حجز، عميل، أو فاتورة...">
            </div>
            <div class="right">
                <button class="notif" id="notifBtn"><i class="fas fa-bell"></i><span class="dot"></span></button>
                <div class="profile">
                    <div class="avatar" id="profileAvatar">أ</div>
                    <div class="name" id="profileName">مدير النظام<small>منتجع حياله</small></div>
                    <i class="fas fa-chevron-down"></i>
                </div>
            </div>
        </header>

        <!-- ==========================================================
        DASHBOARD
        ========================================================== -->
        <div class="main-content">
            <div class="dash">
                <div class="page-wrapper">

                    <!-- ===== PAGE HEADER ===== -->
                    <div class="page-header">
                        <h1>
                            <i class="fas fa-calendar-check"></i>
                            سجل الحجوزات
                        </h1>
                        <div class="actions">
                            <a href="add-invoice.html" class="btn btn-success">
                                <i class="fas fa-plus"></i> حجز جديد
                            </a>
                            <button class="btn btn-outline" onclick="loadBookings()">
                                <i class="fas fa-sync-alt"></i> تحديث
                            </button>
                        </div>
                    </div>

                    <!-- ===== CARD ===== -->
                    <div class="card">
                        <div class="card-header">
                            <h2>
                                <i class="fas fa-list"></i>
                                قائمة الحجوزات
                                <span class="badge" id="countBadge">0</span>
                            </h2>
                            <div>
                                <input type="text" id="searchInput2" placeholder="🔍 بحث عن حجز..." class="form-control" style="width:220px;padding:6px 12px;font-size:0.7rem;" oninput="filterTable()">
                            </div>
                        </div>
                        <div class="card-body">
                            <div id="tableContainer">
                                <!-- سيتم تعبئتها بواسطة JavaScript -->
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <!-- ==========================================================
    MOBILE BOTTOM NAVIGATION
    ========================================================== -->
    <nav class="mobile-nav-bottom" id="mobileBottomNav">
        <ul>
            <li><a href="index.html"><i class="fas fa-home"></i><span>الرئيسية</span></a></li>
            <li><a href="add-invoice.html"><i class="fas fa-file-invoice"></i><span>فاتورة</span></a></li>
            <li class="active"><a href="bookings.html"><i class="fas fa-list"></i><span>الحجوزات</span></a></li>
            <li><a href="clients.html"><i class="fas fa-users"></i><span>العملاء</span></a></li>
            <li><a href="expenses.html"><i class="fas fa-money-bill-wave"></i><span>المصاريف</span></a></li>
        </ul>
    </nav>

    <!-- ============================================================
    JAVASCRIPT
    ============================================================ -->
    <script>
        /**
         * ============================================================
         * SUPABASE CONFIGURATION
         * ============================================================
         */
        var SUPABASE_URL = 'https://zwuvcblrrrriuylajvba.supabase.co';
        var SUPABASE_ANON_KEY = 'sb_publishable_YFqwTEs-W_kprUgt4bgpCQ_tf5vVeFa';

        /**
         * ============================================================
         * التحقق من تسجيل الدخول
         * ============================================================
         */
        var user = JSON.parse(localStorage.getItem('user') || '{}');
        if (!user || !user.email) {
            window.location.href = 'login.html';
        }

        // عرض اسم المستخدم في الـ Header
        var profileName = document.getElementById('profileName');
        var profileAvatar = document.getElementById('profileAvatar');
        if (user && user.name) {
            profileName.innerHTML = user.name + '<small>' + (user.role === 'admin' ? 'مدير النظام' : 'مستخدم') + '</small>';
            profileAvatar.textContent = user.name.charAt(0) || 'أ';
        }

        /**
         * ============================================================
         * تسجيل الخروج
         * ============================================================
         */
        function logoutUser() {
            if (confirm('هل أنت متأكد من تسجيل الخروج؟')) {
                localStorage.removeItem('user');
                window.location.href = 'login.html';
            }
        }

        /* ============================================================
           SIDEBAR TOGGLE
           ============================================================ */
        var sidebar = document.getElementById('sidebar');
        var overlay = document.getElementById('sidebarOverlay');
        var hamburger = document.getElementById('hamburger');
        var mobileOpen = false;

        function toggleSidebar() {
            if (window.innerWidth <= 768) {
                mobileOpen = !mobileOpen;
                if (mobileOpen) {
                    sidebar.classList.add('open');
                    overlay.classList.add('active');
                    document.body.style.overflow = 'hidden';
                    hamburger.innerHTML = '<i class="fas fa-times"></i>';
                } else {
                    sidebar.classList.remove('open');
                    overlay.classList.remove('active');
                    document.body.style.overflow = '';
                    hamburger.innerHTML = '<i class="fas fa-bars"></i>';
                }
            } else {
                sidebar.classList.toggle('open');
                overlay.classList.toggle('active');
                document.body.style.overflow = sidebar.classList.contains('open') ? 'hidden' : '';
            }
        }

        if (hamburger) {
            hamburger.addEventListener('click', toggleSidebar);
        }

        if (overlay) {
            overlay.addEventListener('click', function() {
                if (window.innerWidth <= 768 && mobileOpen) {
                    toggleSidebar();
                } else {
                    sidebar.classList.remove('open');
                    overlay.classList.remove('active');
                    document.body.style.overflow = '';
                    hamburger.innerHTML = '<i class="fas fa-bars"></i>';
                }
            });
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && window.innerWidth <= 768 && mobileOpen) {
                toggleSidebar();
            }
        });

        window.addEventListener('resize', function() {
            if (window.innerWidth > 768) {
                sidebar.classList.remove('open');
                overlay.classList.remove('active');
                document.body.style.overflow = '';
                mobileOpen = false;
                hamburger.innerHTML = '<i class="fas fa-bars"></i>';
            }
        });

        /* ============================================================
           NOTIFICATION BUTTON
           ============================================================ */
        document.getElementById('notifBtn').addEventListener('click', function() {
            alert('📬 لديك 3 إشعارات جديدة');
        });

        /* ============================================================
           جلب البيانات من Supabase
           ============================================================ */
        var allBookings = [];
        var filteredBookings = [];

        function formatDate(dateStr) {
            if (!dateStr) return '-';
            var d = new Date(dateStr);
            return d.toLocaleDateString('ar-EG');
        }

        function isFutureDate(dateStr) {
            if (!dateStr) return false;
            var today = new Date();
            var todayDate = new Date(today.getFullYear(), today.getMonth(), today.getDate());
            var d = new Date(dateStr);
            var dOnly = new Date(d.getFullYear(), d.getMonth(), d.getDate());
            return dOnly >= todayDate;
        }

        function renderTable(data) {
            var container = document.getElementById('tableContainer');
            var countBadge = document.getElementById('countBadge');

            if (!data || data.length === 0) {
                container.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-calendar-check"></i>
                            <p>لا توجد حجوزات</p>
                            <span>اضغط على "حجز جديد" لإضافة أول حجز</span>
                        </div>
                    `;
                countBadge.textContent = '0';
                return;
            }

            var html = `
                    <table>
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>رقم الحجز</th>
                                <th>تاريخ الفاتورة</th>
                                <th>تاريخ الدخول</th>
                                <th>تاريخ الخروج</th>
                                <th>اسم العميل</th>
                                <th>نوع العقار</th>
                                <th>عدد الأيام</th>
                                <th>السعر اليومي</th>
                                <th>الخصم</th>
                                <th>المدفوع</th>
                                <th>المتبقي</th>
                                <th>الإجمالي</th>
                                <th>الحالة</th>
                                <th>نوع الإقامة</th>
                            </tr>
                        </thead>
                        <tbody>
                    `;

            data.forEach(function(item, index) {
                var total = parseFloat(item.total) || 0;
                var paid = parseFloat(item.paid) || 0;
                var remaining = parseFloat(item.remaining) || 0;
                var nights = parseInt(item.nights) || 0;
                var pricePerNight = parseFloat(item.price_per_night) || 0;
                var discount = parseFloat(item.discount) || 0;

                var statusBadge = item.payment_status === 'Fully Paid' ?
                    '<span class="badge badge-paid"><i class="fas fa-check"></i> مدفوع</span>' :
                    '<span class="badge badge-balance"><i class="fas fa-clock"></i> متبقي</span>';

                var isFuture = isFutureDate(item.check_in);
                var bookingNumberDisplay = item.booking_number || '#' + (index + 1);
                var rowClass = isFuture ? 'is-future' : '';

                var invoiceDate = formatDate(item.invoice_date);
                var checkIn = formatDate(item.check_in);
                var checkOut = formatDate(item.check_out);

                html += `
                        <tr class="${rowClass}">
                            <td>${index + 1}</td>
                            <td>${bookingNumberDisplay} ${isFuture ? '<span class="badge badge-future">⭐</span>' : ''}</td>
                            <td>${invoiceDate}</td>
                            <td>${checkIn}</td>
                            <td>${checkOut}</td>
                            <td style="font-weight:700;">${item.client_name || '-'}</td>
                            <td><span class="badge badge-type">${item.property_type || '-'}</span></td>
                            <td>${nights}</td>
                            <td>${pricePerNight.toFixed(2)}</td>
                            <td>${discount.toFixed(2)}</td>
                            <td>${paid.toFixed(2)}</td>
                            <td style="font-weight:700;color:var(--rust);">${remaining.toFixed(2)}</td>
                            <td style="font-weight:800;color:var(--ink);">${total.toFixed(2)}</td>
                            <td>${statusBadge}</td>
                            <td>${item.stay_type || '-'}</td>
                        </tr>
                    `;
            });

            html += `
                        </tbody>
                    </table>
                `;

            container.innerHTML = html;
            countBadge.textContent = data.length;
        }

        async function loadBookings() {
            var container = document.getElementById('tableContainer');
            container.innerHTML = `
                    <div class="empty-state">
                        <div class="spinner"></div>
                        <p>جاري تحميل البيانات...</p>
                    </div>
                `;

            try {
                var response = await fetch(SUPABASE_URL + '/rest/v1/bookings?select=*&order=check_in.desc', {
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': 'Bearer ' + SUPABASE_ANON_KEY
                    }
                });

                if (!response.ok) {
                    throw new Error('فشل في جلب البيانات');
                }

                allBookings = await response.json();
                filteredBookings = allBookings.slice();
                renderTable(filteredBookings);

            } catch (error) {
                console.error('❌ خطأ:', error);
                container.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-exclamation-triangle" style="color:var(--rust);"></i>
                            <p style="color:var(--rust);">حدث خطأ في تحميل البيانات</p>
                            <span>${error.message}</span>
                            <br><br>
                            <button class="btn btn-primary" onclick="loadBookings()">
                                <i class="fas fa-sync-alt"></i> إعادة المحاولة
                            </button>
                        </div>
                    `;
            }
        }

        /* ============================================================
           البحث والفلترة
           ============================================================ */
        var searchInput = document.getElementById('searchInput2');

        function filterTable() {
            var term = searchInput.value.toLowerCase().trim();

            if (!term) {
                filteredBookings = allBookings.slice();
            } else {
                filteredBookings = allBookings.filter(function(item) {
                    var name = (item.client_name || '').toLowerCase();
                    var num = String(item.booking_number || '').toLowerCase();
                    var prop = (item.property_type || '').toLowerCase();
                    return name.includes(term) || num.includes(term) || prop.includes(term);
                });
            }

            renderTable(filteredBookings);
        }

        if (searchInput) {
            searchInput.addEventListener('input', filterTable);
        }

        /* ============================================================
           تحميل الصفحة
           ============================================================ */
        document.addEventListener('DOMContentLoaded', function() {
            loadBookings();
        });

        // تحديث كل 5 دقائق
        setInterval(loadBookings, 300000);

        /**
         * ============================================================
         * رسالة الترحيب في Console
         * ============================================================
         */
        console.log('📋 صفحة سجل الحجوزات - منتجع حياله');
        console.log('📊 Supabase URL:', SUPABASE_URL);
        console.log('👤 المستخدم:', user.name || 'غير معروف');
        console.log('✅ جاهزة للعمل');
    </script>

</body>
