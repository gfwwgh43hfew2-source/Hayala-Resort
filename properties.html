<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>إدارة العقارات - منتجع حياله</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: #f0ede8;
            color: #1a1714;
            direction: rtl;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* ===== Header ===== */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 24px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .header h1 {
            font-size: 1.4rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header h1 i {
            color: #dd9f2e;
        }

        .header .actions {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: #1a1714;
            color: #ffffff;
        }

        .btn-primary:hover {
            background: #2c3644;
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
        }

        .btn-success {
            background: #1d7b6c;
            color: #ffffff;
        }

        .btn-success:hover {
            background: #156b5d;
            transform: translateY(-2px);
        }

        .btn-warning {
            background: #dd9f2e;
            color: #1a1714;
        }

        .btn-warning:hover {
            background: #c98a1a;
            transform: translateY(-2px);
        }

        .btn-danger {
            background: #bf4f30;
            color: #ffffff;
        }

        .btn-danger:hover {
            background: #a63a31;
            transform: translateY(-2px);
        }

        .btn-outline {
            background: transparent;
            border: 1.5px solid #dde3e0;
            color: #5a4f45;
        }

        .btn-outline:hover {
            background: #f0ede8;
            border-color: #c7d0cc;
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 0.7rem;
            border-radius: 8px;
        }

        /* ===== Table Card ===== */
        .card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            overflow: hidden;
        }

        .card-header {
            padding: 18px 24px;
            border-bottom: 1px solid #eef1ef;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }

        .card-header h2 {
            font-size: 1rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-header .badge {
            background: #f0ede8;
            padding: 2px 12px;
            border-radius: 50px;
            font-size: 0.7rem;
            font-weight: 700;
            color: #5a4f45;
        }

        .card-body {
            padding: 20px 24px;
            overflow-x: auto;
        }

        /* ===== Table ===== */
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }

        table thead th {
            background: #f8f6f2;
            padding: 12px 14px;
            text-align: center;
            font-weight: 700;
            font-size: 0.7rem;
            color: #5a4f45;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 2px solid #eef1ef;
            white-space: nowrap;
        }

        table tbody td {
            padding: 12px 14px;
            text-align: center;
            border-bottom: 1px solid #f0ede8;
            color: #1a1714;
        }

        table tbody tr:hover {
            background: #faf8f4;
        }

        table tbody tr:last-child td {
            border-bottom: none;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 14px;
            border-radius: 50px;
            font-size: 0.65rem;
            font-weight: 700;
        }

        .status-available {
            background: #e2f2ee;
            color: #1d7b6c;
        }

        .status-occupied {
            background: #fbe8e1;
            color: #bf4f30;
        }

        .status-maintenance {
            background: #faead0;
            color: #7a5312;
        }

        .actions-cell {
            display: flex;
            gap: 6px;
            justify-content: center;
            flex-wrap: wrap;
        }

        /* ===== Modal ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            z-index: 999;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal {
            background: #ffffff;
            border-radius: 16px;
            max-width: 560px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 32px 36px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            animation: modalIn 0.25s ease;
        }

        @keyframes modalIn {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }

        .modal-header h2 {
            font-size: 1.2rem;
            font-weight: 800;
        }

        .modal-close {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: #f0ede8;
            color: #5a4f45;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-close:hover {
            background: #eef1ef;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            color: #5a4f45;
            margin-bottom: 4px;
        }

        .form-group label .required {
            color: #bf4f30;
        }

        .form-control {
            width: 100%;
            padding: 10px 14px;
            border: 1.5px solid #dde3e0;
            border-radius: 10px;
            font-family: 'Cairo', sans-serif;
            font-size: 0.85rem;
            color: #1a1714;
            background: #ffffff;
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
        }

        .form-control:focus {
            border-color: #dd9f2e;
            box-shadow: 0 0 0 4px rgba(221, 159, 46, 0.12);
        }

        .form-control::placeholder {
            color: #cdc4b8;
        }

        select.form-control {
            appearance: auto;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .form-actions {
            display: flex;
            gap: 10px;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid #eef1ef;
        }

        .form-actions .btn {
            flex: 1;
            justify-content: center;
        }

        /* ===== Toast ===== */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 99999;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-width: 380px;
            width: 90%;
        }

        .toast {
            padding: 14px 18px;
            border-radius: 12px;
            background: #ffffff;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
            border-right: 4px solid #1a1714;
            display: flex;
            align-items: center;
            gap: 12px;
            animation: slideIn 0.3s ease;
        }

        .toast.success {
            border-right-color: #1d7b6c;
        }

        .toast.error {
            border-right-color: #bf4f30;
        }

        .toast.warning {
            border-right-color: #dd9f2e;
        }

        .toast .icon {
            font-size: 1.1rem;
        }

        .toast .content {
            flex: 1;
        }

        .toast .content .title {
            font-weight: 700;
            font-size: 0.8rem;
        }

        .toast .content .message {
            font-size: 0.7rem;
            color: #5a4f45;
        }

        .toast .close-toast {
            background: none;
            border: none;
            color: #cdc4b8;
            cursor: pointer;
            font-size: 0.8rem;
            padding: 4px;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* ===== Empty State ===== */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #cdc4b8;
        }

        .empty-state i {
            font-size: 3rem;
            opacity: 0.3;
            margin-bottom: 16px;
            display: block;
        }

        .empty-state p {
            font-size: 0.9rem;
            color: #5a4f45;
        }

        .empty-state span {
            font-size: 0.75rem;
            color: #cdc4b8;
        }

        /* ===== Loading ===== */
        .loading-row td {
            padding: 40px 20px !important;
        }

        .spinner {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 3px solid #eef1ef;
            border-top: 3px solid #dd9f2e;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ===== Responsive ===== */
        @media (max-width: 768px) {
            body {
                padding: 12px;
            }

            .header {
                padding: 16px 18px;
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
            }

            .header .actions {
                justify-content: stretch;
            }

            .header .actions .btn {
                flex: 1;
                justify-content: center;
            }

            .card-body {
                padding: 12px 14px;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .modal {
                padding: 24px 18px;
            }

            table {
                font-size: 0.75rem;
            }

            table thead th,
            table tbody td {
                padding: 8px 8px;
            }

            .actions-cell {
                flex-direction: column;
                gap: 4px;
            }

            .actions-cell .btn {
                width: 100%;
                justify-content: center;
            }
        }

        @media (max-width: 480px) {
            .header h1 {
                font-size: 1.1rem;
            }

            .card-header {
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
            }

            table thead th:nth-child(5),
            table tbody td:nth-child(5) {
                display: none;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- ===== Header ===== -->
        <div class="header">
            <h1>
                <i class="fas fa-building"></i>
                إدارة العقارات
            </h1>
            <div class="actions">
                <button class="btn btn-success" onclick="openAddModal()">
                    <i class="fas fa-plus"></i> إضافة عقار
                </button>
                <button class="btn btn-outline" onclick="loadProperties()">
                    <i class="fas fa-sync-alt"></i> تحديث
                </button>
            </div>
        </div>

        <!-- ===== Table Card ===== -->
        <div class="card">
            <div class="card-header">
                <h2>
                    <i class="fas fa-list"></i>
                    قائمة العقارات
                    <span class="badge" id="countBadge">0</span>
                </h2>
                <div>
                    <input type="text" id="searchInput" placeholder="🔍 بحث عن عقار..." class="form-control" style="width:220px;padding:6px 12px;font-size:0.75rem;" oninput="filterTable()">
                </div>
            </div>
            <div class="card-body">
                <div id="tableContainer">
                    <!-- سيتم تعبئتها بواسطة JavaScript -->
                </div>
            </div>
        </div>

    </div>

    <!-- ==========================================================
    MODAL - إضافة / تعديل عقار
    ========================================================== -->
    <div class="modal-overlay" id="propertyModal">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modalTitle">إضافة عقار جديد</h2>
                <button class="modal-close" onclick="closeModal()"><i class="fas fa-times"></i></button>
            </div>

            <form id="propertyForm" onsubmit="saveProperty(event)">
                <input type="hidden" id="editId" value="">

                <div class="form-group">
                    <label>اسم العقار <span class="required">*</span></label>
                    <input type="text" class="form-control" id="propertyName" placeholder="مثال: شاليه رقم 5" required />
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>نوع العقار <span class="required">*</span></label>
                        <select class="form-control" id="propertyType" required>
                            <option value="">اختر النوع</option>
                            <option value="شاليه">شاليه</option>
                            <option value="مزرعة">مزرعة</option>
                            <option value="غرفة">غرفة</option>
                            <option value="فيلا">فيلا</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>السعر لكل ليلة (ر.س) <span class="required">*</span></label>
                        <input type="number" class="form-control" id="propertyPrice" placeholder="0" min="0" step="0.01" required />
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>السعة (عدد الأشخاص)</label>
                        <input type="number" class="form-control" id="propertyCapacity" placeholder="4" min="1" value="4" />
                    </div>
                    <div class="form-group">
                        <label>الحالة</label>
                        <select class="form-control" id="propertyStatus">
                            <option value="available">متاح</option>
                            <option value="occupied">محجوز</option>
                            <option value="maintenance">تحت الصيانة</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>الوصف</label>
                    <textarea class="form-control" id="propertyDescription" rows="3" placeholder="وصف العقار..."></textarea>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-success" id="submitBtn">
                        <i class="fas fa-save"></i> حفظ
                    </button>
                    <button type="button" class="btn btn-outline" onclick="closeModal()">إلغاء</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ===== Toast Container ===== -->
    <div class="toast-container" id="toastContainer"></div>

    <script>
        // ============================================================
        // بيانات الاتصال بـ Supabase
        // ============================================================
        var SUPABASE_URL = 'https://zwuvcblrrrriuylajvba.supabase.co';
        var SUPABASE_ANON_KEY = 'sb_publishable_YFqwTEs-W_kprUgt4bgpCQ_tf5vVeFa';

        // ============================================================
        // المتغيرات العامة
        // ============================================================
        var properties = [];
        var editId = null;

        // ============================================================
        // جلب العقارات من Supabase
        // ============================================================
        async function loadProperties() {
            var container = document.getElementById('tableContainer');
            container.innerHTML = `
                <div class="empty-state">
                    <div class="spinner"></div>
                    <p>جاري تحميل البيانات...</p>
                </div>
            `;

            try {
                var response = await fetch(SUPABASE_URL + '/rest/v1/properties?select=*&order=created_at.desc', {
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': 'Bearer ' + SUPABASE_ANON_KEY
                    }
                });

                if (!response.ok) {
                    throw new Error('فشل في جلب البيانات');
                }

                properties = await response.json();
                renderTable(properties);

            } catch (error) {
                console.error('❌ خطأ:', error);
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-exclamation-triangle" style="color:#bf4f30;"></i>
                        <p style="color:#bf4f30;">حدث خطأ في تحميل البيانات</p>
                        <span>${error.message}</span>
                        <br><br>
                        <button class="btn btn-primary" onclick="loadProperties()">
                            <i class="fas fa-sync-alt"></i> إعادة المحاولة
                        </button>
                    </div>
                `;
                showToast('خطأ', 'فشل في تحميل العقارات', 'error');
            }
        }

        // ============================================================
        // عرض الجدول
        // ============================================================
        function renderTable(data) {
            var container = document.getElementById('tableContainer');
            var countBadge = document.getElementById('countBadge');

            if (!data || data.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-building"></i>
                        <p>لا توجد عقارات</p>
                        <span>اضغط على "إضافة عقار" لإضافة أول عقار</span>
                    </div>
                `;
                countBadge.textContent = '0';
                return;
            }

            var html = `
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>اسم العقار</th>
                            <th>النوع</th>
                            <th>السعر/ليلة</th>
                            <th>السعة</th>
                            <th>الحالة</th>
                            <th>الإجراءات</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            data.forEach(function(item, index) {
                var statusClass = 'status-available';
                var statusText = 'متاح';
                if (item.status === 'occupied') {
                    statusClass = 'status-occupied';
                    statusText = 'محجوز';
                } else if (item.status === 'maintenance') {
                    statusClass = 'status-maintenance';
                    statusText = 'تحت الصيانة';
                }

                html += `
                    <tr data-id="${item.id}">
                        <td>${index + 1}</td>
                        <td><strong>${item.name}</strong></td>
                        <td>${item.type || '-'}</td>
                        <td>${item.price_per_night ? item.price_per_night.toLocaleString() + ' ر.س' : '0'}</td>
                        <td>${item.capacity || '-'}</td>
                        <td><span class="status-badge ${statusClass}">${statusText}</span></td>
                        <td>
                            <div class="actions-cell">
                                <button class="btn btn-warning btn-sm" onclick="openEditModal('${item.id}')">
                                    <i class="fas fa-edit"></i>
                                </button>
                                <button class="btn btn-danger btn-sm" onclick="deleteProperty('${item.id}')">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                        </td>
                    </tr>
                `;
            });

            html += `
                    </tbody>
                </table>
            `;

            container.innerHTML = html;
            countBadge.textContent = data.length;
        }

        // ============================================================
        // البحث والفلترة
        // ============================================================
        function filterTable() {
            var searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
            if (!searchTerm) {
                renderTable(properties);
                return;
            }

            var filtered = properties.filter(function(item) {
                return item.name.toLowerCase().includes(searchTerm) ||
                    (item.type && item.type.toLowerCase().includes(searchTerm));
            });

            renderTable(filtered);
        }

        // ============================================================
        // فتح نموذج الإضافة
        // ============================================================
        function openAddModal() {
            editId = null;
            document.getElementById('editId').value = '';
            document.getElementById('modalTitle').textContent = 'إضافة عقار جديد';
            document.getElementById('submitBtn').innerHTML = '<i class="fas fa-save"></i> حفظ';
            document.getElementById('propertyForm').reset();
            document.getElementById('propertyStatus').value = 'available';
            document.getElementById('propertyCapacity').value = '4';
            document.getElementById('propertyModal').classList.add('show');
        }

        // ============================================================
        // فتح نموذج التعديل
        // ============================================================
        function openEditModal(id) {
            var item = properties.find(function(p) { return p.id === id; });
            if (!item) {
                showToast('خطأ', 'العقار غير موجود', 'error');
                return;
            }

            editId = id;
            document.getElementById('editId').value = id;
            document.getElementById('modalTitle').textContent = 'تعديل عقار';
            document.getElementById('submitBtn').innerHTML = '<i class="fas fa-edit"></i> تحديث';
            document.getElementById('propertyName').value = item.name || '';
            document.getElementById('propertyType').value = item.type || '';
            document.getElementById('propertyPrice').value = item.price_per_night || '';
            document.getElementById('propertyCapacity').value = item.capacity || 4;
            document.getElementById('propertyStatus').value = item.status || 'available';
            document.getElementById('propertyDescription').value = item.description || '';

            document.getElementById('propertyModal').classList.add('show');
        }

        // ============================================================
        // إغلاق النموذج
        // ============================================================
        function closeModal() {
            document.getElementById('propertyModal').classList.remove('show');
        }

        // ============================================================
        // حفظ العقار (إضافة أو تعديل)
        // ============================================================
        async function saveProperty(event) {
            event.preventDefault();

            var name = document.getElementById('propertyName').value.trim();
            var type = document.getElementById('propertyType').value;
            var price = parseFloat(document.getElementById('propertyPrice').value) || 0;
            var capacity = parseInt(document.getElementById('propertyCapacity').value) || 4;
            var status = document.getElementById('propertyStatus').value;
            var description = document.getElementById('propertyDescription').value.trim();
            var editId = document.getElementById('editId').value;

            if (!name) {
                showToast('تنبيه', 'يرجى إدخال اسم العقار', 'warning');
                document.getElementById('propertyName').focus();
                return;
            }

            if (!type) {
                showToast('تنبيه', 'يرجى اختيار نوع العقار', 'warning');
                document.getElementById('propertyType').focus();
                return;
            }

            if (price <= 0) {
                showToast('تنبيه', 'يرجى إدخال سعر صحيح', 'warning');
                document.getElementById('propertyPrice').focus();
                return;
            }

            var data = {
                name: name,
                type: type,
                price_per_night: price,
                capacity: capacity,
                status: status,
                description: description,
                updated_at: new Date().toISOString()
            };

            var isEdit = editId ? true : false;
            var url = SUPABASE_URL + '/rest/v1/properties';
            var method = 'POST';
            var body = data;

            if (isEdit) {
                url += '?id=eq.' + editId;
                method = 'PATCH';
            }

            try {
                var response = await fetch(url, {
                    method: method,
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
                        'Content-Type': 'application/json',
                        'Prefer': 'return=minimal'
                    },
                    body: JSON.stringify(body)
                });

                if (!response.ok) {
                    throw new Error('فشل في حفظ البيانات');
                }

                closeModal();
                showToast(
                    isEdit ? '✅ تم التعديل' : '✅ تم الإضافة',
                    isEdit ? 'تم تحديث بيانات العقار بنجاح' : 'تم إضافة العقار بنجاح',
                    'success'
                );
                loadProperties();

            } catch (error) {
                console.error('❌ خطأ:', error);
                showToast('خطأ', 'فشل في حفظ البيانات', 'error');
            }
        }

        // ============================================================
        // حذف العقار
        // ============================================================
        async function deleteProperty(id) {
            var item = properties.find(function(p) { return p.id === id; });
            if (!item) {
                showToast('خطأ', 'العقار غير موجود', 'error');
                return;
            }

            if (!confirm('هل أنت متأكد من حذف عقار "' + item.name + '"؟')) {
                return;
            }

            try {
                var response = await fetch(SUPABASE_URL + '/rest/v1/properties?id=eq.' + id, {
                    method: 'DELETE',
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': 'Bearer ' + SUPABASE_ANON_KEY
                    }
                });

                if (!response.ok) {
                    throw new Error('فشل في حذف العقار');
                }

                showToast('✅ تم الحذف', 'تم حذف عقار "' + item.name + '" بنجاح', 'success');
                loadProperties();

            } catch (error) {
                console.error('❌ خطأ:', error);
                showToast('خطأ', 'فشل في حذف العقار', 'error');
            }
        }

        // ============================================================
        // نظام Toast (الإشعارات)
        // ============================================================
        function showToast(title, message, type) {
            var container = document.getElementById('toastContainer');
            var toast = document.createElement('div');
            toast.className = 'toast ' + (type || '');
            var iconMap = {
                'success': 'fa-check-circle',
                'error': 'fa-times-circle',
                'warning': 'fa-exclamation-triangle'
            };
            var icon = iconMap[type] || 'fa-info-circle';

            toast.innerHTML = `
                <span class="icon"><i class="fas ${icon}"></i></span>
                <div class="content">
                    <div class="title">${title}</div>
                    <div class="message">${message}</div>
                </div>
                <button class="close-toast" onclick="this.parentElement.remove()"><i class="fas fa-times"></i></button>
            `;

            container.appendChild(toast);

            setTimeout(function() {
                if (toast.parentElement) {
                    toast.style.opacity = '0';
                    toast.style.transform = 'translateX(20px)';
                    setTimeout(function() {
                        if (toast.parentElement) toast.remove();
                    }, 300);
                }
            }, 4000);
        }

        // ============================================================
        // تحميل الصفحة
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            loadProperties();
        });

        // ============================================================
        // إغلاق المودال بالضغط على Escape
        // ============================================================
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeModal();
            }
        });

        // ============================================================
        // إغلاق المودال بالضغط على الخلفية
        // ============================================================
        document.getElementById('propertyModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });

        console.log('🏗️ صفحة إدارة العقارات - منتجع حياله');
        console.log('📊 Supabase URL:', SUPABASE_URL);
        console.log('🔑 Supabase Key:', SUPABASE_ANON_KEY);
    </script>

</body>
</html>
